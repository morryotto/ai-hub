            justify-content: space-between;

        .prompt-card:hover {

            border-color: #3b4b68;
        }

        let currentCat = 'ALL';

        const categories = ['ALL', ...new Set(prompts.map(p => p.category))];
        
        function renderCategories() {
            const bar = document.getElementById('catBar');
            bar.innerHTML = categories.map(c => `
                <button class="cat-btn ${c === currentCat ? 'active' : ''}" onclick="setCat('${c}')">
                    ${c === 'ALL' ? '🌟 Все стили' : c}
                </button>
            `).join('');
        }

        function setCat(cat) {
            currentCat = cat;
            renderCategories();
            filterPrompts();
        }

        function filterPrompts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = prompts.filter(p => {
                const matchCat = currentCat === 'ALL' || p.category === currentCat;
                const matchQuery = p.text.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });

            const grid = document.getElementById('grid');
            grid.innerHTML = filtered.slice(0, 100).map(p => `
                <div class="prompt-card">
                    <div>
                        <div class="prompt-header">
                            <span class="cat-tag">${p.category}</span>
                            <span style="color:var(--text-muted); font-size:12px;">#${p.id}</span>
                        </div>
                        <div class="prompt-text">${p.text}</div>
                    </div>
                    <button class="btn-copy" onclick="copyPrompt('${p.id}')">📋 Скопировать промпт</button>
                </div>
            `).join('');
        }

        function copyPrompt(id) {
            const p = prompts.find(x => x.id === id);
            if (!p) return;
            navigator.clipboard.writeText(p.text).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        renderCategories();
        filterPrompts();
    </script>
